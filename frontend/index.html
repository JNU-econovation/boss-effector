<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Effector - Guitar Effect Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2942 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 18px;
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px dashed rgba(255, 215, 0, 0.3);
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: rgba(255, 215, 0, 0.6);
            background: rgba(255, 255, 255, 0.1);
        }

        .upload-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #FFD700;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .file-input-label {
            display: block;
            padding: 15px 20px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #1a2942;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .file-input {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-size: 14px;
            color: #a0aec0;
        }

        .file-info.selected {
            color: #4ade80;
            border-left: 3px solid #4ade80;
        }

        .analyze-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .analyze-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .analyze-button:disabled {
            background: #4a5568;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .progress-container {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1a2942;
        }

        .progress-message {
            text-align: center;
            font-size: 16px;
            color: #FFD700;
            margin-top: 10px;
        }

        .results-container {
            display: none;
            background: rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .results-container.active {
            display: block;
        }

        .result-title {
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #10b981;
        }

        .result-label {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .processing {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎸 BOSS EFFECTOR</div>
            <div class="subtitle">AI-Powered Guitar Effect Analyzer</div>
        </div>

        <div class="upload-section">
            <div class="upload-title">1. 기타 샘플 사운드 업로드 (최소 8초)</div>
            <div class="file-input-wrapper">
                <label for="guitar-sample" class="file-input-label">
                    📁 기타 샘플 선택 (WAV, M4A, MP3)
                </label>
                <input type="file" id="guitar-sample" class="file-input" accept=".wav,.m4a,.mp3">
            </div>
            <div class="file-info" id="guitar-info">파일을 선택해주세요</div>
        </div>

        <div class="upload-section">
            <div class="upload-title">2. 원곡 업로드 (최소 30초)</div>
            <div class="file-input-wrapper">
                <label for="original-song" class="file-input-label">
                    📁 원곡 선택 (WAV, MP4, MP3)
                </label>
                <input type="file" id="original-song" class="file-input" accept=".wav,.mp4,.mp3">
            </div>
            <div class="file-info" id="song-info">파일을 선택해주세요</div>
        </div>

        <button class="analyze-button" id="analyze-btn" disabled>
            🎵 분석 시작
        </button>

        <div class="error-message" id="error-message"></div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>
            <div class="progress-message processing" id="progress-message">
                처리 중...
            </div>
        </div>

        <div class="results-container" id="results-container">
            <div class="result-title">✨ 분석 결과</div>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        const guitarInput = document.getElementById('guitar-sample');
        const songInput = document.getElementById('original-song');
        const guitarInfo = document.getElementById('guitar-info');
        const songInfo = document.getElementById('song-info');
        const analyzeBtn = document.getElementById('analyze-btn');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressMessage = document.getElementById('progress-message');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');
        const errorMessage = document.getElementById('error-message');

        let guitarFile = null;
        let songFile = null;

        guitarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                guitarFile = file;
                guitarInfo.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                guitarInfo.classList.add('selected');
                checkFiles();
            }
        });

        songInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                songFile = file;
                songInfo.textContent = `✓ ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                songInfo.classList.add('selected');
                checkFiles();
            }
        });

        function checkFiles() {
            if (guitarFile && songFile) {
                analyzeBtn.disabled = false;
            }
        }

        analyzeBtn.addEventListener('click', async () => {
            errorMessage.classList.remove('active');
            resultsContainer.classList.remove('active');
            progressContainer.classList.add('active');
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('guitar_sample', guitarFile);
            formData.append('original_song', songFile);

            try {
                updateProgress(10, '파일 업로드 중...');

                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('분석 요청 실패');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.status === 'progress') {
                                updateProgress(data.progress, data.message);
                            } else if (data.status === 'completed') {
                                updateProgress(100, '분석 완료!');
                                displayResults(data.result);
                            } else if (data.status === 'error') {
                                throw new Error(data.message);
                            }
                        }
                    }
                }
            } catch (error) {
                showError(error.message);
                progressContainer.classList.remove('active');
            } finally {
                analyzeBtn.disabled = false;
            }
        });

        function updateProgress(percent, message) {
            progressBar.style.width = `${percent}%`;
            progressBar.textContent = `${percent}%`;
            progressMessage.textContent = message;
        }

        function displayResults(result) {
            progressContainer.classList.remove('active');
            resultsContainer.classList.add('active');

            let html = '';
            
            if (result.effector_type) {
                html += `
                    <div class="result-item">
                        <div class="result-label">이펙터 타입</div>
                        <div class="result-value">${result.effector_type}</div>
                    </div>
                `;
            }

            if (result.parameters) {
                for (const [key, value] of Object.entries(result.parameters)) {
                    html += `
                        <div class="result-item">
                            <div class="result-label">${key}</div>
                            <div class="result-value">${value}</div>
                        </div>
                    `;
                }
            }

            resultsContent.innerHTML = html;
        }

        function showError(message) {
            errorMessage.textContent = `❌ 오류: ${message}`;
            errorMessage.classList.add('active');
        }
    </script>
</body>
</html>
