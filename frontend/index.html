<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Effector - Guitar Effect Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎸 BOSS EFFECTOR</div>
            <div class="subtitle">AI-Powered Guitar Effect Analyzer</div>
        </div>

        <div class="upload-section">
            <div class="upload-title">1. 기타 샘플 사운드 업로드 (최소 8초)</div>
            <div class="file-input-wrapper">
                <label for="guitar-sample" class="file-input-label">
                    📁 기타 샘플 선택 (WAV, M4A, MP3)
                </label>
                <input type="file" id="guitar-sample" class="file-input" accept=".wav,.m4a,.mp3">
            </div>
            <div class="file-info" id="guitar-info">파일을 선택해주세요</div>
        </div>

        <div class="upload-section">
            <div class="upload-title">2. 원곡 업로드 (최소 30초)</div>
            <div class="file-input-wrapper">
                <label for="original-song" class="file-input-label">
                    📁 원곡 선택 (WAV, M4A, MP3)
                </label>
                <input type="file" id="original-song" class="file-input" accept=".wav,.mp4,.mp3">
            </div>
            <div class="file-info" id="song-info">파일을 선택해주세요</div>
        </div>

        <button class="analyze-button" id="analyze-btn" disabled>
            🎵 분석 시작
        </button>

        <div class="error-message" id="error-message"></div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progress-bar">0%</div>
            </div>
            <div class="progress-message processing" id="progress-message">
                처리 중...
            </div>
        </div>

        <div class="results-container" id="results-container">
            <div class="result-title">✨ 분석 결과</div>
            <div id="results-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
